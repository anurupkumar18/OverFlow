apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "__TEAM__"
            - name: ES_URL
              valueFrom:
                secretKeyRef: {name: app-credentials, key: es-url, optional: true}
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef: {name: app-credentials, key: es-api-key, optional: true}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: app-credentials, key: admin-token, optional: true}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef: {name: app-credentials, key: otlp-endpoint, optional: true}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef: {name: app-credentials, key: otlp-headers, optional: true}
            - name: OTEL_SERVICE_NAME
              value: overflow
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: DASH0_API_URL
              valueFrom:
                secretKeyRef: {name: app-credentials, key: dash0-api-url, optional: true}
            - name: DASH0_READ_TOKEN
              valueFrom:
                secretKeyRef: {name: app-credentials, key: dash0-read-token, optional: true}
            - name: DASH0_DATASET
              valueFrom:
                secretKeyRef: {name: app-credentials, key: dash0-dataset, optional: true}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
