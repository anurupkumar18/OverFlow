# Your live URL: https://__TEAM__.cnh.radarhq.io. The hackathon cluster only
# accepts this one hostname from your namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: cnh
      namespace: gateway
      sectionName: https
  hostnames:
    - __TEAM__.cnh.radarhq.io
  rules:
    - backendRefs:
        - name: app
          port: 80
