name: Overflow checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, America/Denver, Asia/Tokyo]
    env:
      TZ: ${{ matrix.timezone }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm --prefix app test
      - run: node --test scripts/telemetry.test.cjs scripts/status-provider.test.cjs
      - run: node scripts/otlp-smoke.cjs
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/ingest/catalog.py --validate app/data/catalog.json
      - name: Report ranking evaluation evidence
        run: python eval/gate.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg APP_VERSION=${{ github.sha }} -t overflow:ci .
